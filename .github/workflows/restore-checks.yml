name: Restore regression checks

on:
  pull_request:
    paths:
      - 'cmd/global-aws-restore'
      - 'cmd/global-gcp-restore'
      - 'tests/**'
      - '.github/workflows/restore-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Cloud SDKs are mocked in tests/test_utils.py; no credentials or pip installs.
      - name: Run all Python tests
        run: |
          python -m pip install pytest
          python -m pytest tests -q
